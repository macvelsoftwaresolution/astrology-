<div class="matches-container">
  <div class="card-box header-banner-card" style="margin-bottom: 24px; padding: 18px 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px;">
    <div>
      <h1 style="font-size: 20px; font-weight: 800; color: #0f172a; margin: 0 0 4px 0; display: flex; align-items: center; gap: 8px;">
        <i class="bi bi-gear-fill" style="color:#d97706;"></i>{{ 'lmsSettings.title' | translate }}
      </h1>
      <p style="font-size: 13px; color: #64748b; margin: 0; font-weight: 500;">{{ 'lmsSettings.subtitle' | translate }}</p>
    </div>
  </div>

  <div class="card-box" style="padding: 24px;">
    @if (saveMsg) {
      <div style="background-color: #d1fae5; color: #065f46; padding: 12px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; font-weight: 600;">
        <i class="bi bi-check-circle-fill me-2"></i>{{ saveMsg }}
      </div>
    }

    <!-- 1. COURSE ADMISSION FEES CONFIGURATION -->
    <div style="background: #fffbeb; border: 1px solid #fde68a; padding: 18px 20px; border-radius: 12px; margin-bottom: 24px;">
      <h3 style="font-size: 16px; font-weight: 700; color: #92400e; margin: 0 0 14px 0; display: flex; align-items: center; gap: 8px;">
        <i class="bi bi-cash-coin" style="font-size: 20px;"></i> {{ 'lmsSettings.feesTitle' | translate }}
      </h3>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px;">
        <div class="form-group" style="margin: 0;">
          <label style="font-weight: 700; color: #78350f; font-size: 13.5px; margin-bottom: 6px; display: block;">
            <i class="bi bi-mortarboard-fill me-1" style="color: #d97706;"></i> {{ 'lmsSettings.ilanilaiFee' | translate }}
          </label>
          <input 
            type="number" 
            [(ngModel)]="ilanilaiFee" 
            style="width: 100%; padding: 10px 14px; border: 1px solid #fcd34d; border-radius: 8px; font-size: 15px; font-weight: 700; color: #0f172a; background: #fff;" 
            placeholder="2500"
          />
        </div>
        <div class="form-group" style="margin: 0;">
          <label style="font-weight: 700; color: #78350f; font-size: 13.5px; margin-bottom: 6px; display: block;">
            <i class="bi bi-mortarboard-fill me-1" style="color: #d97706;"></i> {{ 'lmsSettings.mudhunilaiFee' | translate }}
          </label>
          <input 
            type="number" 
            [(ngModel)]="mudhunilaiFee" 
            style="width: 100%; padding: 10px 14px; border: 1px solid #fcd34d; border-radius: 8px; font-size: 15px; font-weight: 700; color: #0f172a; background: #fff;" 
            placeholder="3500"
          />
        </div>
      </div>
    </div>

    <!-- Vilakaurai Textarea -->
    <div class="form-group" style="margin-bottom: 28px; border-bottom: 1px solid #e2e8f0; padding-bottom: 24px;">
      <label style="font-weight: 700; color: #1e293b; display: block; margin-bottom: 10px; font-size: 16px;">
        <i class="bi bi-file-earmark-text-fill me-1" style="color: #d97706;"></i> {{ 'lmsSettings.vilakaurai' | translate }}
      </label>
      <textarea 
        [(ngModel)]="vilakaurai" 
        rows="10" 
        style="width: 100%; min-height: 220px; padding: 14px 16px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 15px; line-height: 1.6; font-family: inherit; resize: vertical;" 
        [placeholder]="'lmsSettings.vilakauraiPlaceholder' | translate"></textarea>
    </div>

    <!-- Rules & Regulations Textarea -->
    <div class="form-group" style="margin-bottom: 28px;">
      <label style="font-weight: 700; color: #1e293b; display: block; margin-bottom: 10px; font-size: 16px;">
        <i class="bi bi-shield-check me-1" style="color: #d97706;"></i> {{ 'lmsSettings.rulesTitle' | translate }}
      </label>
      <textarea 
        [(ngModel)]="rulesText" 
        rows="10" 
        style="width: 100%; min-height: 220px; padding: 14px 16px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 15px; line-height: 1.6; font-family: inherit; resize: vertical;" 
        [placeholder]="'lmsSettings.rulesPlaceholder' | translate"></textarea>
    </div>

    <div style="text-align: right; border-top: 1px solid #e2e8f0; padding-top: 20px;">
      <button 
        class="btn-primary" 
        style="padding: 10px 24px; font-size: 15px;" 
        (click)="saveSettings()" 
        [disabled]="isSaving">
        @if (isSaving) {
          <i class="bi bi-hourglass-split me-2"></i> {{ 'lmsSettings.saving' | translate }}
        } @else {
          <i class="bi bi-floppy2-fill me-2"></i> {{ 'lmsSettings.saveSettings' | translate }}
        }
      </button>
    </div>
  </div>
</div>
