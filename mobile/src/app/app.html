<ion-app>
  <app-spinner-loader></app-spinner-loader>
  <ion-router-outlet></ion-router-outlet>

  <!-- ================= EXIT APP CONFIRMATION MODAL ================= -->
  @if (isExitModalOpen) {
    <div class="exit-modal-backdrop" (click)="cancelExit()">
      <div class="exit-modal-card" (click)="$event.stopPropagation()">
        <!-- Red Icon with soft pink circle -->
        <div class="exit-icon-circle">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="none" viewBox="0 0 24 24" stroke="#E11D48" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </div>

        <!-- Title & Subtitle -->
        <h2 class="exit-modal-title">வெளியேற வேண்டுமா?</h2>
        <p class="exit-modal-desc">செயலியிலிருந்து வெளியேற நிச்சயமாக விரும்புகிறீர்களா?</p>

        <!-- Actions -->
        <div class="exit-actions-row">
          <button type="button" class="btn-cancel" (click)="cancelExit()">
            ரத்து
          </button>
          <button type="button" class="btn-confirm-exit" (click)="confirmExit()">
            வெளியேறு
          </button>
        </div>
      </div>
    </div>
  }
</ion-app>
