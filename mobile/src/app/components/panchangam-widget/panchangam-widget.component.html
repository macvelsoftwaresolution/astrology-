<div class="panchangam-widget">
  <div class="widget-header">
    <h3>இன்றைய பஞ்சாங்கம்</h3>
    <span class="widget-date">மேலும் காண்க</span>
  </div>
  <div class="panch-grid">
    <!-- Top Row -->
    <div class="panch-item top-left">
      <span class="panch-label">திதி</span>
      <span class="panch-value value-highlight">{{ panchangam.thithi }}</span>
    </div>
    <div class="panch-item top-right">
      <span class="panch-label">நட்சத்திரம்</span>
      <span class="panch-value value-highlight">{{ panchangam.star }}</span>
    </div>
    <!-- Bottom Row -->
    <div class="panch-item bottom-left">
      <span class="panch-label label-red">இராகு காலம்</span>
      <span class="panch-value value-red">{{ panchangam.rahukalam }}</span>
    </div>
    <div class="panch-item bottom-right">
      <span class="panch-label label-gold">நல்ல நேரம்</span>
      <span class="panch-value value-gold">09:15 - 10:15</span>
    </div>
  </div>
  <div class="panch-footer-icon">
    <span class="chakra-icon"><i class="bi bi-sun-fill text-gold fs-4"></i></span>
  </div>
</div>
