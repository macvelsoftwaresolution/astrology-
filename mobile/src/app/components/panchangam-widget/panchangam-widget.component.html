<div class="panchangam-widget">
  <div class="widget-header">
    <span class="widget-icon">🕉️</span>
    <h3>இன்றைய பஞ்சாங்கம்</h3>
    <span class="widget-date">மேலும் காண்க</span>
  </div>
  <div class="panch-grid">
    <div class="panch-item">
      <span class="panch-label">திதி</span>
      <span class="panch-value value-highlight">{{ panchangam.thithi }}</span>
    </div>
    <div class="panch-item">
      <span class="panch-label">நстановление</span>
      <span class="panch-value value-highlight">{{ panchangam.star }}</span>
    </div>
    <div class="panch-item">
      <span class="panch-label">இராகு காலம்</span>
      <span class="panch-value value-time">{{ panchangam.rahukalam }}</span>
    </div>
    <div class="panch-item">
      <span class="panch-label">எமகண்டம்</span>
      <span class="panch-value value-time">{{ panchangam.yamagandam }}</span>
    </div>
  </div>
</div>
