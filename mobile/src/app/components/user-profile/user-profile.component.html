<!-- Booking History -->
<div class="section-title-row" style="margin-top: 1.5rem; margin-bottom: 0.85rem;">
  <h3>பணம் செலுத்திய வரலாறு</h3>
</div>
<div class="orders-list">
  <div class="order-history-card" *ngFor="let order of orders">
    <div class="oh-header">
      <strong>{{ order.service }}</strong>
      <span class="status-dot" [class.dot-pending]="order.status === 'Pending'">{{ order.status === 'Pending' ? 'நிலுவையில்' : 'முடிந்தது' }}</span>
    </div>
    <p class="oh-desc">{{ order.details }}</p>
    <div class="oh-footer">
      <span>தேதி: {{ order.date }}</span>
      <strong>₹{{ order.price }}</strong>
    </div>
  </div>
</div>
