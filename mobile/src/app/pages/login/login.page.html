<ion-content [fullscreen]="true" class="login-content">
  <div class="login-container">
    <!-- Back arrow & Header -->
    <div class="nav-header">
      <button class="back-btn" (click)="goBack()">
        <i class="bi bi-arrow-left"></i>
      </button>
      <h1 class="brand-title">ஆருத்ரா</h1>
      <div style="width: 40px;"></div>
    </div>

    <!-- Top Image Icon -->
    <div class="gopuram-icon-wrapper">
      <div class="gopuram-icon" style="padding: 0; overflow: hidden; border-color: #ECC876;">
        <img src="assets/images/welcome_guru.jpg" alt="Astro Divine" style="width: 100%; height: 100%; object-fit: cover;">
      </div>
    </div>

    <!-- Header Titles -->
    <div class="form-header">
      <h2 class="form-title">Welcome Back</h2>
      <p class="form-subtitle">உள்நுழைவு</p>
    </div>


    <!-- Form -->
    <form #loginFormRef="ngForm" (ngSubmit)="onLogin()" class="login-form" novalidate>
      <div class="input-group">
        <label>Mobile Number / Username</label>
        <div class="input-wrapper">
          <input type="text" name="mobileNumber" [(ngModel)]="mobileNumber" required placeholder="அலைபேசி எண் / பெயர்">
          <span class="input-icon"><i class="bi bi-person"></i></span>
        </div>
      </div>

      <div class="input-group">
        <label>Password</label>
        <div class="input-wrapper">
          <input type="password" name="password" [(ngModel)]="password" required minlength="6" placeholder="கடவுச்சொல்">
          <span class="input-icon"><i class="bi bi-key"></i></span>
        </div>
      </div>

      @if (errorMessage) {
        <div class="login-error-alert">
          <i class="bi bi-exclamation-triangle-fill"></i>
          <span>{{ errorMessage }}</span>
        </div>
      }

      <button type="submit" class="submit-btn">
        <span class="btn-primary-text">Login and Continue</span>
        <span class="btn-secondary-text">உள்நுழைந்து தொடரவும்</span>
      </button>
    </form>

    <!-- Switch to register -->
    <div class="switch-auth-mode">
      <span>புதிய கணக்கு வேண்டுமா? </span>
      <a (click)="goToRegister()">பதிவு செய்க</a>
    </div>

    <!-- Privacy Note -->
    <div class="privacy-note">
      <span><i class="bi bi-shield-lock-fill"></i> Your information is secure and private.</span>
    </div>
  </div>
</ion-content>
