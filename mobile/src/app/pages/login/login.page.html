<ion-content [fullscreen]="true" class="login-content">
  <div class="login-container">
    <!-- Back arrow & Header -->
    <div class="nav-header">
      <button class="back-btn" (click)="goBack()">
        <i class="bi bi-arrow-left"></i>
      </button>
      <h1 class="brand-title">{{ 'login.title' | translate }}</h1>
      <div style="width: 40px;"></div>
    </div>

    <!-- Top Image Icon -->
    <div class="gopuram-icon-wrapper">
      <div class="gopuram-icon" style="padding: 0; overflow: hidden; border-color: #ECC876;">
        <img src="assets/images/welcome_guru.jpg" alt="Astro Divine" style="width: 100%; height: 100%; object-fit: cover;">
      </div>
    </div>

    <!-- Header Titles (Single title to prevent duplicate brand name) -->
    <div class="form-header">
      <h2 class="form-title">{{ 'login.subtitle' | translate }}</h2>
    </div>


    <!-- Form -->
    <form #loginFormRef="ngForm" (ngSubmit)="onLogin()" class="login-form" novalidate>
      <div class="input-group">
        <label>{{ 'login.usernamePlaceholder' | translate }}</label>
        <div class="input-wrapper">
          <input type="text" name="mobileNumber" [(ngModel)]="mobileNumber" required>
          <span class="input-icon"><i class="bi bi-person"></i></span>
        </div>
      </div>

      <div class="input-group">
        <label>{{ 'login.passwordPlaceholder' | translate }}</label>
        <div class="input-wrapper">
          <input [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="password" required minlength="6">
          <span class="input-icon toggle-pwd-btn" (click)="toggleShowPassword()" style="cursor: pointer; pointer-events: auto;">
            <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash-fill' : 'bi-eye-fill'"></i>
          </span>
        </div>
      </div>

      @if (errorMessage) {
        <div class="login-error-alert">
          <i class="bi bi-exclamation-triangle-fill"></i>
          <span>{{ errorMessage | translate }}</span>
        </div>
      }

      <button type="submit" class="submit-btn">
        <span class="btn-primary-text">{{ 'login.submitBtn' | translate }}</span>
      </button>
    </form>

    <!-- Switch to register -->
    <div class="switch-auth-mode">
      <span>{{ 'login.needAccount' | translate }} </span>
      <a (click)="goToRegister()">{{ 'login.registerNow' | translate }}</a>
    </div>

    <!-- Privacy Note -->
    <div class="privacy-note">
      <span><i class="bi bi-shield-lock-fill"></i> Your information is secure and private.</span>
    </div>
  </div>
</ion-content>
