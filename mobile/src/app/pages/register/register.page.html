<ion-content [fullscreen]="true" class="register-content">
  <div class="register-container">
    <!-- Header -->
    <div class="nav-header">
      <h1 class="brand-title">{{ 'welcome.brand' | translate }}</h1>
    </div>

    <!-- Top Image Icon -->
    <div class="gopuram-icon-wrapper">
      <div class="gopuram-icon" style="padding: 0; overflow: hidden; border-color: #ECC876;">
        <img src="assets/images/welcome_guru.jpg" alt="Astro Divine" style="width: 100%; height: 100%; object-fit: cover;">
      </div>
    </div>

    <!-- Header Titles (Single title to prevent duplicate brand name) -->
    <div class="form-header">
      <h2 class="form-title">{{ 'register.subtitle' | translate }}</h2>
    </div>

    <!-- Form -->
    <form #registerFormRef="ngForm" (ngSubmit)="onRegister()" class="register-form" novalidate>
      <!-- Profile Image Upload -->
      <div class="profile-pic-upload" style="text-align: center; margin-bottom: 20px;">
        <label for="profilePicInput" class="upload-label" style="display: inline-block; cursor: pointer;">
          @if (profilePicBase64) {
            <div class="avatar-preview" style="width: 80px; height: 80px; border-radius: 50%; overflow: hidden; margin: 0 auto 10px; border: 2px solid #ECC876;">
              <img [src]="profilePicBase64" alt="Profile" style="width: 100%; height: 100%; object-fit: cover;"/>
            </div>
          } @else {
            <div class="avatar-placeholder" style="width: 80px; height: 80px; border-radius: 50%; background-color: #f0f0f0; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; border: 2px dashed #A27B38;">
              <i class="bi bi-camera-fill" style="font-size: 24px; color: #A27B38;"></i>
            </div>
          }
          <span class="upload-text" style="color: #A27B38; font-size: 14px;">{{ 'register.uploadPhoto' | translate }}</span>
        </label>
        <input type="file" id="profilePicInput" accept="image/*" (change)="onFileSelected($event)" style="display: none;">
      </div>

      <div class="input-group">
        <label>{{ 'register.namePlaceholder' | translate }}</label>
        <div class="input-wrapper">
          <input type="text" name="fullName" [(ngModel)]="fullName" required minlength="2">
          <span class="input-icon"><i class="bi bi-person"></i></span>
        </div>
      </div>

      <div class="input-group">
        <label>{{ 'register.phonePlaceholder' | translate }}</label>
        <div class="input-wrapper">
          <input type="tel" name="mobileNumber" [(ngModel)]="mobileNumber" required pattern="^[6-9]\d{9}$">
          <span class="input-icon"><i class="bi bi-phone"></i></span>
        </div>
      </div>

      <div class="input-group">
        <label>{{ 'register.emailPlaceholder' | translate }}</label>
        <div class="input-wrapper">
          <input type="email" name="emailAddress" [(ngModel)]="emailAddress" required>
          <span class="input-icon"><i class="bi bi-envelope"></i></span>
        </div>
      </div>

      <div class="input-group">
        <label>{{ 'register.passwordPlaceholder' | translate }}</label>
        <div class="input-wrapper">
          <input [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="password" required minlength="6">
          <span class="input-icon toggle-pwd-btn" (click)="showPassword = !showPassword">
            <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash-fill' : 'bi-eye-fill'"></i>
          </span>
        </div>
      </div>

      <div class="input-group">
        <label>{{ 'register.confirmPasswordPlaceholder' | translate }}</label>
        <div class="input-wrapper">
          <input [type]="showConfirmPassword ? 'text' : 'password'" name="confirmPassword" [(ngModel)]="confirmPassword" required minlength="6">
          <span class="input-icon toggle-pwd-btn" (click)="showConfirmPassword = !showConfirmPassword">
            <i class="bi" [ngClass]="showConfirmPassword ? 'bi-eye-slash-fill' : 'bi-eye-fill'"></i>
          </span>
        </div>
      </div>

      @if (errorMessage) {
        <div class="register-error-alert">
          <i class="bi bi-exclamation-triangle-fill"></i>
          <span>{{ errorMessage | translate }}</span>
        </div>
      }

      <button type="submit" class="submit-btn">
        <span class="btn-primary-text">{{ 'register.submitBtn' | translate }}</span>
      </button>
    </form>

    <!-- Switch to login -->
    <div class="switch-auth-mode">
      <span>{{ 'register.haveAccount' | translate }} </span>
      <a (click)="goToLogin()">{{ 'register.loginNow' | translate }}</a>
    </div>

    <!-- Privacy Note -->
    <div class="privacy-note">
      <span><i class="bi bi-shield-lock-fill"></i> Your information is secure and private.</span>
    </div>
  </div>
</ion-content>
