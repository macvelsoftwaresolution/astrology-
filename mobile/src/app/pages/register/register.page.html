<ion-content [fullscreen]="true" class="register-content">
  <div class="register-container">
    <!-- Back arrow & Header -->
    <div class="nav-header">
      <button class="back-btn" (click)="goBack()">
        <i class="bi bi-arrow-left"></i>
      </button>
      <h1 class="brand-title">ஆருத்ரா</h1>
      <div style="width: 40px;"></div> <!-- placeholder to balance back button -->
    </div>

    <!-- Top Image Icon -->
    <div class="gopuram-icon-wrapper">
      <div class="gopuram-icon" style="padding: 0; overflow: hidden; border-color: #ECC876;">
        <img src="assets/images/welcome_guru.jpg" alt="Astro Divine" style="width: 100%; height: 100%; object-fit: cover;">
      </div>
    </div>

    <!-- Header Titles -->
    <div class="form-header">
      <h2 class="form-title">Begin Your Journey</h2>
      <p class="form-subtitle">பதிவு செய்தல்</p>
    </div>

    <!-- Form -->
    <form #registerFormRef="ngForm" (ngSubmit)="onRegister()" class="register-form" novalidate>
      <!-- Profile Image Upload -->
      <div class="profile-pic-upload" style="text-align: center; margin-bottom: 20px;">
        <label for="profilePicInput" class="upload-label" style="display: inline-block; cursor: pointer;">
          @if (profilePicBase64) {
            <div class="avatar-preview" style="width: 80px; height: 80px; border-radius: 50%; overflow: hidden; margin: 0 auto 10px; border: 2px solid #ECC876;">
              <img [src]="profilePicBase64" alt="Profile" style="width: 100%; height: 100%; object-fit: cover;"/>
            </div>
          } @else {
            <div class="avatar-placeholder" style="width: 80px; height: 80px; border-radius: 50%; background-color: #f0f0f0; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; border: 2px dashed #A27B38;">
              <i class="bi bi-camera-fill" style="font-size: 24px; color: #A27B38;"></i>
            </div>
          }
          <span class="upload-text" style="color: #A27B38; font-size: 14px;">படம் பதிவேற்றவும்</span>
        </label>
        <input type="file" id="profilePicInput" accept="image/*" (change)="onFileSelected($event)" style="display: none;">
      </div>

      <div class="input-group">
        <label>Full Name</label>
        <div class="input-wrapper">
          <input type="text" name="fullName" [(ngModel)]="fullName" required minlength="2" placeholder="உள்நுழைய பெயர்">
          <span class="input-icon"><i class="bi bi-person"></i></span>
        </div>
      </div>

      <div class="input-group">
        <label>Mobile Number</label>
        <div class="input-wrapper">
          <input type="tel" name="mobileNumber" [(ngModel)]="mobileNumber" required pattern="^[6-9]\d{9}$" placeholder="அலைபேசி எண்">
          <span class="input-icon"><i class="bi bi-phone"></i></span>
        </div>
      </div>

      <div class="input-group">
        <label>Email Address</label>
        <div class="input-wrapper">
          <input type="email" name="emailAddress" [(ngModel)]="emailAddress" required placeholder="மின்னஞ்சல் முகவரி">
          <span class="input-icon"><i class="bi bi-envelope"></i></span>
        </div>
      </div>

      <div class="input-group">
        <label>Password (கடவுச்சொல்)</label>
        <div class="input-wrapper">
          <input [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="password" required minlength="6" placeholder="குறைந்தது 6 எழுத்துக்கள்">
          <span class="input-icon" (click)="showPassword = !showPassword" style="cursor: pointer;">
            <i class="bi" [class.bi-eye]="showPassword" [class.bi-key]="!showPassword"></i>
          </span>
        </div>
      </div>

      <div class="input-group">
        <label>Confirm Password (உறுதிப்படுத்தல்)</label>
        <div class="input-wrapper">
          <input [type]="showConfirmPassword ? 'text' : 'password'" name="confirmPassword" [(ngModel)]="confirmPassword" required minlength="6" placeholder="மீண்டும் கடவுச்சொல் உள்ளிடவும்">
          <span class="input-icon" (click)="showConfirmPassword = !showConfirmPassword" style="cursor: pointer;">
            <i class="bi" [class.bi-eye]="showConfirmPassword" [class.bi-lock]="!showConfirmPassword"></i>
          </span>
        </div>
      </div>

      @if (errorMessage) {
        <div class="register-error-alert" style="background-color: #fee2e2; border: 1px solid #fca5a5; color: #991b1b; padding: 0.75rem 1rem; border-radius: 10px; font-size: 0.82rem; font-weight: 600; display: flex; align-items: center; gap: 0.5rem; margin-top: 0.4rem; line-height: 1.35;">
          <i class="bi bi-exclamation-triangle-fill"></i>
          <span>{{ errorMessage }}</span>
        </div>
      }

      <button type="submit" class="submit-btn">
        <span class="btn-primary-text">Register and Continue</span>
        <span class="btn-secondary-text">பதிவு செய்து தொடரவும்</span>
      </button>
    </form>

    <!-- Switch to login -->
    <div class="switch-auth-mode">
      <span>ஏற்கனவே கணக்கு உள்ளதா? </span>
      <a (click)="goToLogin()">உள்நுழைய</a>
    </div>

    <!-- Privacy Note -->
    <div class="privacy-note">
      <span><i class="bi bi-shield-lock-fill"></i> Your information is secure and private.</span>
    </div>
  </div>
</ion-content>
