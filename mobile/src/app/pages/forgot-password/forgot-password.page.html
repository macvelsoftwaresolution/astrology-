<ion-content [fullscreen]="true" class="forgot-pwd-content">
  <div class="forgot-pwd-container">
    <!-- Back arrow & Header -->
    <div class="nav-header">
      <button class="back-btn" (click)="goBack()">
        <span class="back-arrow">←</span>
      </button>
      <h1 class="brand-title">ஆருத்ரா</h1>
      <div style="width: 40px;"></div>
    </div>

    <!-- Gopuram Icon -->
    <div class="gopuram-icon-wrapper">
      <div class="gopuram-icon">
        <svg viewBox="0 0 100 100" class="gopuram-svg">
          <path d="M50 15 L53 22 H47 Z" fill="#A27B38" />
          <path d="M44 22 H56 L55 35 H45 Z" fill="#ECC876" stroke="#A27B38" stroke-width="1.5" />
          <path d="M41 35 H59 L58 48 H42 Z" fill="#ECC876" stroke="#A27B38" stroke-width="1.5" />
          <path d="M37 48 H63 L61 65 H39 Z" fill="#ECC876" stroke="#A27B38" stroke-width="1.5" />
          <path d="M32 65 H68 L66 85 H34 Z" fill="#ECC876" stroke="#A27B38" stroke-width="1.5" />
          <path d="M46 85 V75 C46 72 54 72 54 75 V85 Z" fill="#4A0E17" />
        </svg>
      </div>
    </div>

    <!-- Header Titles -->
    <div class="form-header">
      <h2 class="form-title">Reset Password</h2>
      <p class="form-subtitle">கடவுச்சொல் மீட்பு</p>
    </div>

    <!-- Form -->
    <div class="forgot-pwd-form">
      <p class="instructions-txt">
        உங்கள் கணக்குடன் இணைக்கப்பட்ட அலைபேசி எண்ணை உள்ளிடவும். உங்கள் கடவுச்சொல் இங்கே மீட்டெடுக்கப்படும்.
      </p>

      <div class="input-group">
        <label>Registered Mobile Number</label>
        <div class="input-wrapper">
          <input type="tel" [(ngModel)]="mobileNumber" placeholder="பதிவுசெய்த அலைபேசி எண்">
          <span class="input-icon">📱</span>
        </div>
      </div>

      <button class="submit-btn" (click)="onResetPassword()">
        <span class="btn-primary-text">Retrieve Password</span>
        <span class="btn-secondary-text">கடவுச்சொல்லைக் காட்டு</span>
      </button>

      <!-- Recovered Password Display Box -->
      @if (recoveredPassword) {
        <div class="recovered-pwd-box">
          <span class="box-badge">வெற்றி!</span>
          <p class="recovered-label">உங்கள் கடவுச்சொல்:</p>
          <p class="recovered-value">{{ recoveredPassword }}</p>
          <button class="back-to-login-btn" (click)="goBack()">உள்நுழைய செல்லவும்</button>
        </div>
      }
    </div>

    <!-- Privacy Note -->
    <div class="privacy-note">
      <span>🔒 Your information is secure and private.</span>
    </div>
  </div>
</ion-content>
