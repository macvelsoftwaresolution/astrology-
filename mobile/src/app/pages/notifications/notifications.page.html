<ion-header class="app-top-navbar ion-no-border">
  <div class="top-navbar-content">
    <div class="top-nav-left">
      <button type="button" class="top-nav-back-btn" (click)="goBack()">
        <i class="bi bi-arrow-left"></i>
      </button>
      <div class="top-nav-title-box">
        <h1 class="top-nav-title">அறிவிப்புகள் (Notifications)</h1>
      </div>
    </div>
    <div class="top-nav-right" *ngIf="unreadCount > 0">
      <button class="btn btn-sm btn-outline-warning" (click)="markAllRead()" style="font-size: 11px; border-radius: 20px;">
        அனைத்தும் படித்தவை
      </button>
    </div>
  </div>
</ion-header>

<ion-content [fullscreen]="true" class="astrology-app-content" style="--background: #fdfaf6;">
  <!-- Loading state -->
  <div *ngIf="loading" style="text-align: center; padding: 3rem;">
    <ion-spinner name="crescent" color="warning"></ion-spinner>
    <p style="color: #8a7a60; margin-top: 10px; font-size: 13px;">அறிவிப்புகள் ஏற்றப்படுகிறது...</p>
  </div>

  <!-- Empty state -->
  <div *ngIf="!loading && notifications.length === 0" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 75%; text-align: center; padding: 2rem; color: #4A0E17;">
    <i class="bi bi-bell-slash" style="font-size: 3.5rem; margin-bottom: 1rem; color: #a38c64;"></i>
    <h2 style="font-weight: bold; margin-bottom: 0.5rem; font-size: 18px;">புதிய அறிவிப்புகள் ஏதுமில்லை</h2>
    <p style="color: #6a5e4d; font-size: 13px;">தற்போது உங்களுக்கு எந்த புதிய தகவல்களும் இல்லை.</p>
  </div>

  <!-- Notification Cards List -->
  <div class="p-3" *ngIf="!loading && notifications.length > 0">
    <div *ngFor="let n of notifications" 
         (click)="markRead(n)"
         class="notif-item-card mb-3 p-3 rounded-4 shadow-sm position-relative cursor-pointer"
         [style.background]="n.is_read ? '#ffffff' : '#fff9f0'"
         [style.border]="n.is_read ? '1px solid #eadecb' : '1.5px solid #d4af37'">
      
      <div class="d-flex align-items-start gap-3">
        <div class="notif-icon-circle" style="width: 42px; height: 42px; border-radius: 50%; background: #f7eee2; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 20px;">
          <i class="bi" [ngClass]="getNotifIcon(n.type)"></i>
        </div>
        <div class="flex-grow-1">
          <div class="d-flex justify-content-between align-items-start">
            <h6 class="mb-1 fw-bold text-maroon" style="font-size: 14px;">{{ n.title }}</h6>
            <span *ngIf="!n.is_read" class="badge rounded-pill bg-warning text-dark" style="font-size: 9px;">புதியது</span>
          </div>
          <p class="mb-2 text-secondary" style="font-size: 12.5px; line-height: 1.5;">{{ n.body }}</p>
          <small class="text-muted" style="font-size: 11px;">
            <i class="bi bi-clock me-1"></i>{{ n.created_at | date:'dd MMM yyyy, hh:mm a' }}
          </small>
        </div>
      </div>
    </div>
  </div>
</ion-content>
