<div class="wizard-container">
  <div class="rules-header">
    <div class="rules-shield-icon"><i class="bi bi-shield-check"></i></div>
    <h2 class="rules-heading">{{ 'learn.rulesTitle' | translate }}</h2>
    <p class="rules-subheading">{{ 'learn.rulesSubheading' | translate }}</p>
  </div>

  <!-- Single Rules Textarea display -->
  <div class="rules-list" *ngIf="rulesText">
    <div class="vilakkavurai-card" style="white-space: pre-line;">
      <div class="card-bg-icon"><i class="bi bi-shield-check"></i></div>
      <p class="vilakkavurai-text" style="margin: 0;">{{ rulesText }}</p>
    </div>
  </div>

  <!-- Fallback Array Rules display -->
  <div class="rules-list" *ngIf="!rulesText && rules && rules.length > 0">
    <div class="vilakkavurai-card" *ngFor="let rule of rules">
      <div class="card-bg-icon"><i class="bi bi-shield-check"></i></div>
      <strong *ngIf="rule.title">{{ rule.title }}</strong>
      <p class="vilakkavurai-text">{{ rule.desc }}</p>
    </div>
  </div>

  <button class="action-submit-btn" (click)="next.emit()">
    <span>{{ 'learn.iAgreeAndContinue' | translate }}</span>
    <i class="bi bi-arrow-right ms-2"></i>
  </button>
</div>
