<div class="wizard-container">
  <div class="course-intro-banner">
    <div class="banner-overlay"></div>
    <img src="assets/images/spiritual_education_bg.png" alt="Fundamentals" class="banner-img">
    <div class="banner-badge">அறிமுகம்</div>
    <h2 class="banner-title">வேத ஜோதிட அடிப்படைகள்</h2>
  </div>

  <div class="section-block">
    <h3 class="section-title">விளக்கவுரை (Vilakkavurai)</h3>
    <p class="section-desc" style="white-space: pre-wrap;">{{ vilakauraiText }}</p>
  </div>

  <div class="section-block">
    <h3 class="section-title"><i class="bi bi-lightbulb-fill text-gold me-2"></i>நீங்கள் கற்கவிருப்பது</h3>
    <div class="topics-grid">
      <div class="topic-item" *ngFor="let topic of topics; let i = index">
        <div class="topic-icon" [ngClass]="getColorClass(i)"><i class="bi" [ngClass]="getIcon(i)"></i></div>
        <div>
          <strong>{{ topic.title }}</strong>
          <p>{{ topic.desc }}</p>
        </div>
      </div>
    </div>
  </div>

  <div class="actions-wrapper">
    <button class="action-submit-btn" (click)="next.emit()">
      <i class="bi bi-mortarboard-fill me-2"></i>
      <span>புதிய சேர்க்கை (Enroll Course)</span>
      <i class="bi bi-arrow-right ms-2"></i>
    </button>
    <button type="button" class="action-login-btn-outline" (click)="login.emit()">
      <i class="bi bi-box-arrow-in-right me-2"></i>
      <span>ஏற்கனவே பதிவு செய்தவரா? உள்நுழைக (Login)</span>
    </button>
  </div>
</div>
