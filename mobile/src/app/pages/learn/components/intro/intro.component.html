<div class="wizard-container">
  <div class="course-intro-banner">
    <div class="banner-overlay"></div>
    <img src="assets/images/spiritual_education_bg.png" alt="Fundamentals" class="banner-img">
    <div class="banner-badge">{{ 'learn.intro' | translate }}</div>
    <h2 class="banner-title">{{ 'learn.vedicBasics' | translate }}</h2>
  </div>

  <div class="section-block" *ngIf="vilakauraiText">
    <h3 class="section-title"><i class="bi bi-info-circle-fill text-gold me-2"></i>{{ 'learn.vilakkavuraiTitle' | translate }}</h3>
    <div class="vilakkavurai-card">
      <div class="card-bg-icon"><i class="bi bi-quote"></i></div>
      <p class="vilakkavurai-text">{{ vilakauraiText }}</p>
    </div>
  </div>



  <div class="actions-wrapper">
    <button class="action-submit-btn" (click)="next.emit()">
      <i class="bi bi-mortarboard-fill" style="margin-right: 10px; flex-shrink: 0;"></i>
      <span>{{ 'learn.newEnrollment' | translate }}</span>
      <i class="bi bi-arrow-right" style="margin-left: 10px; flex-shrink: 0;"></i>
    </button>
    <button type="button" class="action-login-btn-outline" (click)="login.emit()">
      <i class="bi bi-box-arrow-in-right" style="margin-right: 10px; flex-shrink: 0;"></i>
      <span>{{ 'learn.alreadyRegisteredLogin' | translate }}</span>
    </button>
  </div>
</div>
