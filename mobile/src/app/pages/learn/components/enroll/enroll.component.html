<div class="wizard-container">
  <div class="form-intro-header">
    <h3>மாணவர் சேர்க்கை படிவம்</h3>
    <p>தெய்வீக துல்லியத்துடன் உங்கள் பயணத்தைத் தொடங்குங்கள்</p>
  </div>

  <div class="enroll-form">
    <div class="form-group">
      <label>முழு பெயர் (Full Name) *</label>
      <div class="input-with-icon">
        <input type="text" [(ngModel)]="localForm.fullName" placeholder="உங்கள் பெயரை உள்ளிடவும்">
        <span class="input-icon"><i class="bi bi-person-fill"></i></span>
      </div>
    </div>

    <div class="form-group">
      <label>பிறந்த தேதி (Date of Birth) *</label>
      <div class="input-with-icon">
        <input type="date" [(ngModel)]="localForm.dob">
        <span class="input-icon"><i class="bi bi-calendar-event-fill"></i></span>
      </div>
    </div>

    <div class="form-group">
      <label>பிறந்த நேரம் (Time of Birth) *</label>
      <div class="input-with-icon">
        <input type="time" [(ngModel)]="localForm.tob">
        <span class="input-icon"><i class="bi bi-clock-fill"></i></span>
      </div>
    </div>

    <div class="form-group">
      <label>பிறந்த இடம் (Place of Birth) *</label>
      <div class="input-with-icon">
        <input type="text" [(ngModel)]="localForm.pob" placeholder="பிறந்த இடம்/ஊர்">
        <span class="input-icon"><i class="bi bi-geo-alt-fill"></i></span>
      </div>
    </div>

    <div class="form-group">
      <label>கல்வித் தகுதி (Educational Qualification) *</label>
      <div class="input-with-icon">
        <select [(ngModel)]="localForm.qualification">
          <option value="">தேர்ந்தெடுக்கவும்...</option>
          <option value="diploma">டிப்ளமோ (Diploma)</option>
          <option value="degree">பட்டப்படிப்பு (Degree)</option>
          <option value="postgraduate">முதுகலை (PG)</option>
          <option value="other">இதர (Other)</option>
        </select>
        <span class="input-icon"><i class="bi bi-mortarboard-fill"></i></span>
      </div>
    </div>

    <div class="form-group">
      <label>வகுப்பு நிலை (Course Level) *</label>
      <select [(ngModel)]="localForm.courseLevel">
        <option value="ilanilai">இளநிலை (Ilanilai / Junior)</option>
        <option value="mudhunilai">முதுநிலை (Mudhunilai / Senior)</option>
      </select>
    </div>

    <!-- Extra fields for mudhunilai -->
    @if (localForm.courseLevel === 'mudhunilai') {
      <div class="form-group">
        <label>இளநிலை சான்றிதழ் (Ilanilai Certificate) *</label>
        <div class="file-upload-wrapper">
          <input type="file" id="cert-upload" (change)="onFileChange($event)" accept="image/*,application/pdf" style="display: none;">
          <label for="cert-upload" class="custom-file-upload">
            📁 {{ localForm.prevCertificate || 'சான்றிதழ் பதிவேற்றவும் (Upload PDF/Image)' }}
          </label>
        </div>
      </div>
    }

    @if (localForm.courseLevel === 'mudhunilai') {
      <div class="form-group">
        <label>எப்போது முடித்தீர்கள்? (Completion Date/Year) *</label>
        <input type="text" [(ngModel)]="localForm.completionYear" placeholder="உதாரணமாக: மே 2023">
      </div>
    }

    @if (localForm.courseLevel === 'mudhunilai') {
      <div class="form-group">
        <label>மதிப்பெண்கள் எவ்வளவு? (Marks Obtained) *</label>
        <input type="text" [(ngModel)]="localForm.prevMarks" placeholder="உதாரணமாக: 85% அல்லது 850/1000">
      </div>
    }

    <div class="form-group">
      <label>இடற்பாடில் சேருவதற்கான காரணம் (Reason for joining this course) *</label>
      <div class="input-with-icon text-area-icon">
        <textarea [(ngModel)]="localForm.reason" rows="3" placeholder="உங்கள் பதிலை உள்ளிடவும்"></textarea>
        <span class="input-icon"><i class="bi bi-chat-left-text-fill"></i></span>
      </div>
    </div>

    <button class="action-submit-btn" (click)="onSubmit()">
      <span>கட்டணம் செலுத்த தொடரவும்</span>
      <i class="bi bi-arrow-right ms-2"></i>
    </button>
  </div>
</div>
