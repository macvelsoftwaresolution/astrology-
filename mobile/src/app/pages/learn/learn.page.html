<ion-content [fullscreen]="true" class="edu-content">
  <!-- Mobile App Sticky Top Header -->
  <div class="overlay-header">
    <button class="btn-back" (click)="handleBack()" aria-label="Go Back">
      <i class="bi bi-arrow-left"></i>
    </button>
    <h2>{{ getHeaderTitle() }}</h2>
    <div style="width: 32px;"></div>
  </div>

  <app-learn-intro *ngIf="currentScreen === 'intro'" (next)="goToRules()"></app-learn-intro>
  <app-learn-rules *ngIf="currentScreen === 'rules'" (next)="agreeAndContinue()"></app-learn-rules>
  <app-learn-enroll *ngIf="currentScreen === 'enroll'" [form]="enrollForm" (next)="submitEnrollment($event)"></app-learn-enroll>
  <app-learn-payment *ngIf="currentScreen === 'payment'" (next)="payAndStart()"></app-learn-payment>
  
  <app-learn-dashboard *ngIf="currentScreen === 'dashboard' && !activeQuiz && !showCertificate" 
                       [enrollForm]="enrollForm" 
                       (logout)="logoutCourse()"
                       (startQuiz)="activeQuiz = true"
                       (viewCertificate)="showCertificate = true">
  </app-learn-dashboard>

  <!-- Overlays -->
  <app-learn-quiz *ngIf="activeQuiz" (close)="activeQuiz = false"></app-learn-quiz>
  <app-learn-certificate *ngIf="showCertificate" [enrollForm]="enrollForm" (close)="showCertificate = false"></app-learn-certificate>
</ion-content>
